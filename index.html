<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task management app built with vanilla JavaScript.">
  <title>Task Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <div>
        <p class="eyebrow">STAY ORGANIZED</p>
        <h1>Task Manager</h1>
        <p class="subtitle">Plan your work. Make progress every day.</p>
      </div>
      <button id="theme-toggle" class="button button-secondary" type="button" aria-label="Toggle dark mode">🌙 Dark mode</button>
    </header>

    <section class="stats-grid" aria-label="Task statistics">
      <article class="stat-card"><span>Total tasks</span><strong id="total-count">0</strong></article>
      <article class="stat-card"><span>Completed</span><strong id="completed-count">0</strong></article>
      <article class="stat-card"><span>Pending</span><strong id="pending-count">0</strong></article>
    </section>

    <section class="panel">
      <h2 id="form-heading">Add a task</h2>
      <form id="task-form">
        <input type="hidden" id="editing-id">
        <div class="form-grid">
          <label class="field field-wide">Task title
            <input id="task-title" name="title" type="text" maxlength="120" placeholder="e.g. Practice JavaScript" required>
          </label>
          <label class="field field-wide">Description <span class="optional">(optional)</span>
            <input id="task-description" name="description" type="text" maxlength="300" placeholder="What needs to be done?">
          </label>
          <label class="field">Priority
            <select id="task-priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </label>
          <label class="field">Due date <span class="optional">(optional)</span>
            <input id="task-due-date" name="dueDate" type="date">
          </label>
        </div>
        <p id="form-error" class="error-message" role="alert" hidden></p>
        <div class="form-actions">
          <button id="submit-button" class="button button-primary" type="submit">＋ Add task</button>
          <button id="cancel-edit" class="button button-secondary" type="button" hidden>Cancel edit</button>
        </div>
      </form>
    </section>
    
    <section class="panel">
      <div class="list-header">
        <div>
          <h2>Your tasks</h2>
          <p class="subtitle">Search, filter, and manage your work.</p>
        </div>
        <label class="search-label" for="search-input">Search
          <input id="search-input" type="search" placeholder="Search tasks...">
        </label>
      </div>

      <div class="toolbar" role="group" aria-label="Filter tasks">
        <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-button" type="button" data-filter="pending" aria-pressed="false">Pending</button>
        <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>

      <div id="task-list" class="task-list" aria-live="polite"></div>
      <p id="empty-state" class="empty-state">No tasks yet. Add your first task above.</p>
      <div class="footer-actions">
        <button id="export-button" class="button button-secondary" type="button">Export JSON</button>
        <button id="clear-completed" class="button button-danger" type="button">Clear completed</button>
      </div>
    </section>
    <footer>Built with HTML, CSS, and vanilla JavaScript · Tasks are saved in this browser.</footer>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
